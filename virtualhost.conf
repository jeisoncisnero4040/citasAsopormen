# Redirección HTTP a HTTPS
<VirtualHost *:80>
    ServerName clinicoapi.asopormen.co
    ServerAdmin webmaster@localhost

    # Redirige todo el tráfico HTTP hacia HTTPS
    Redirect / https://clinicoapi.asopormen.co/

    ErrorLog ${APACHE_LOG_DIR}/clinicoapi-error.log
    CustomLog ${APACHE_LOG_DIR}/clinicoapi-access.log combined
</VirtualHost>

# Configuración HTTPS restringida
<VirtualHost *:443>
    ServerName clinicoapi.asopormen.co
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/clinicoapi/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/clinicoapi.asopormen.co/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/clinicoapi.asopormen.co/privkey.pem

    # Dominios permitidos (producción y desarrollo)
    SetEnvIfNoCase Referer "^https://.*\.?asopormen\.co(/.*)?$" allowed_referer
    SetEnvIfNoCase Origin "^https://.*\.?asopormen\.co$" allowed_origin

    # Permitir localhost:5170 o 5173 (Vite dev server)
    SetEnvIfNoCase Referer "^http://localhost:(5170|5173)/.*$" dev_referer
    SetEnvIfNoCase Origin "^http://localhost:(5170|5173)$" dev_origin

    # Detectar navegadores comunes
    SetEnvIfNoCase User-Agent "Mozilla" is_browser
    SetEnvIfNoCase User-Agent "Chrome" is_browser
    SetEnvIfNoCase User-Agent "Safari" is_browser
    SetEnvIfNoCase User-Agent "Firefox" is_browser
    SetEnvIfNoCase User-Agent "Edge" is_browser

    # Detectar herramientas de desarrollo (Postman y Python)
    SetEnvIfNoCase User-Agent "Postman" is_devtool
    SetEnvIfNoCase User-Agent "python-requests" is_devtool
    SetEnvIfNoCase User-Agent "httpx" is_devtool
    SetEnvIfNoCase User-Agent "curl" is_devtool

    <Directory /var/www/clinicoapi/public>
        AllowOverride All
        Require all granted

        # Permite acceso desde:
        # - Navegadores con origen asopormen.co o Vite dev server
        # - Herramientas dev (Postman, Python, Curl)
        <RequireAny>
            <RequireAll>
                Require env allowed_referer
                Require env allowed_origin
                Require env is_browser
            </RequireAll>
            <RequireAll>
                Require env dev_referer
                Require env dev_origin
                Require env is_browser
            </RequireAll>
            <RequireAll>
                Require env is_devtool
            </RequireAll>
        </RequireAny>
    </Directory>

    # 🔓 CORS solo para clientes válidos
    <IfModule mod_headers.c>
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin"
        Header always set Access-Control-Allow-Credentials "true"
        Header always set Access-Control-Max-Age "86400"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/clinicoapi-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/clinicoapi-ssl-access.log combined
</VirtualHost>
